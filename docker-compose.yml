services:
  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: nacos
    environment:
      - MODE=standalone
    volumes:
      - dev-data:/home/nacos/log
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - dev-net
    restart: on-failure

  mongodb:
    image: mongo:8.0.4
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongoadmin
    volumes:
      - dev-data:/data/db
      - ./data_dev/mongodb:/docker-entrypoint-initdb.d:readonly
    ports:
      - "27017:27017"
    networks:
      - dev-net
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data_dev/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dev-net
    restart: always

volumes:
  dev-data:

networks:
  dev-net:
